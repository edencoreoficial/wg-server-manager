# Bloco para publicar o wgm-panel em subcaminho de um server_name que ja tem TLS.
# Inclua dentro do server { listen 443 ssl; ... } existente.
# No panel.conf: base_path = /wgm/  e  trusted_proxies = <IP do nginx visto pelo painel>
#
# Seguranca por Design: allowlist antes de tudo, limite de tentativas no login,
# sem cache e sem buffer de resposta (paginas podem conter chave privada).

# No contexto http {} (uma vez):
# limit_req_zone $binary_remote_addr zone=wgm_login:1m rate=10r/m;

location /wgm/ {
    # Mesma allowlist do restante do painel (ou include do arquivo gerado pelo noc-allow)
    allow 198.51.100.10;      # escritorio (exemplo)
    deny  all;

    location = /wgm/login {
        limit_req zone=wgm_login burst=5 nodelay;
        proxy_pass http://WGM_UPSTREAM;
        include /etc/nginx/snippets/wgm-proxy.conf;
    }

    proxy_pass http://WGM_UPSTREAM;
    include /etc/nginx/snippets/wgm-proxy.conf;
}

# /etc/nginx/snippets/wgm-proxy.conf
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_http_version 1.1;
#   proxy_set_header Connection "";
#   proxy_buffering off;
#   proxy_read_timeout 120s;      # criar servidor pode levar alguns segundos
#   add_header Cache-Control "no-store" always;
#
# WGM_UPSTREAM:
#   nginx no proprio host ............ 127.0.0.1:8751
#   nginx em container (stack NOC) ... IP do gateway da rede Docker do nginx, ex.: 172.30.1.1:8751
#                                      (troque ListenStream no wgm-panel.socket para esse IP)
